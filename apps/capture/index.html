<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#111311" />
    <!--
      Apply a stored theme before first paint, so a phone set to dark does not
      flash light on every launch. Mirrors readStoredTheme in src/lib/theme.ts
      (same key); with no stored choice it does nothing and the stylesheet
      follows the system.
    -->
    <script>
      try {
        var t = localStorage.getItem("proofchain.capture.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="ProofChain field capture — signed, geo-tagged, offline-first weigh-ins."
    />
    <title>ProofChain Capture</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app" aria-busy="true">
      <p class="boot">Loading capture…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

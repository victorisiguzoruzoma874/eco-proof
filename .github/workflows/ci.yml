name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (build, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Above the ">=20.11" engines floor in the root package.json, not at
          # it: apps/mobile pulls in metro 0.84, which requires ^20.19.4 and
          # warns EBADENGINE on anything lower. The floor stays where it is —
          # only the mobile workspace needs the newer runtime — but CI installs
          # every workspace at once, so it has to satisfy the strictest one.
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        # The first CI run died here on ECONNRESET from the registry — a blip,
        # not a dependency problem. npm's defaults (2 retries, 10s ceiling) gave
        # up 14s in; a longer ladder lets a transient failure resolve itself
        # rather than reporting a red build nobody can act on.
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=60000

      # Must precede typecheck: every workspace imports @proofchain/shared, and
      # tsc resolves it through the package's built .d.ts files rather than its
      # source. Without this, the backend alone fails with 8 TS2307s plus a
      # cascade of implicit-any errors that are really just the missing types.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  backend-integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The default `npm test` excludes these — they need a real database, and a
    # clone with no infrastructure has to stay runnable. Giving them their own
    # job means an unreachable Postgres fails the build here rather than being
    # quietly skipped everywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proofchain
          POSTGRES_PASSWORD: proofchain
          # The suite creates and migrates `proofchain_test` itself; this is
          # only the maintenance database it connects to in order to do so.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the first test can open a connection before Postgres is
        # accepting them — the job then fails on a race, not on the code.
        options: >-
          --health-cmd "pg_isready -U proofchain -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Not the local default of 5433: the service container publishes the
      # standard port here, and there is no compose file to collide with.
      TEST_DATABASE_URL: postgres://proofchain:proofchain@localhost:5432/proofchain_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Kept in step with the node job above; see the note there.
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=60000

      # Only the shared package, not the whole `npm run build`: the tests import
      # @proofchain/shared through its built dist, but they run the backend from
      # source, so building the frontends here would be time spent on nothing.
      - name: Build shared package
        run: npm run build -w @proofchain/shared

      - name: Integration tests
        run: npm run test:integration -w @proofchain/backend

  contracts:
    name: Soroban contract (clippy, test, wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # NOT wasm32-unknown-unknown: Rust 1.82+ enables reference-types and
          # multi-value on that target, which the Soroban environment rejects.
          # See contracts/README.md.
          targets: wasm32v1-none
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build wasm
        run: cargo build --target wasm32v1-none --release

      # Lets a reviewer download the exact bytecode a commit produces and diff it
      # against what is deployed on testnet.
      - uses: actions/upload-artifact@v7
        with:
          name: proofchain-batch-registry-wasm
          path: contracts/target/wasm32v1-none/release/proofchain_batch_registry.wasm
          if-no-files-found: error

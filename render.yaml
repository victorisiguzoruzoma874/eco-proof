# Render blueprint: the API.
#
# Apply it from the Render dashboard (Blueprints → New Blueprint Instance) after
# pointing it at this repository.
#
# Postgres is deliberately NOT declared here: the database is on Neon, which
# keeps the evidentiary record independent of this platform account and gives
# point-in-time restore that a Render free-tier database does not.
#
# Secrets are declared `sync: false`, which means Render prompts for them once
# and stores them encrypted rather than reading them out of this file. Nothing
# in this repository should ever hold a real secret.
#
# Native (non-Docker) runtime: Render's own Node build image compiles the
# workspace directly, the same way CI does. There is no Dockerfile in this
# repository at all — the previous Debian-slim base was chosen for argon2's
# glibc prebuilt binary, and Render's build image is glibc-based too, so that
# binary still resolves without a source compile.

services:
  # -------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------
  - type: web
    name: proofchain-api
    runtime: node
    buildCommand: >-
      npm ci --fetch-retries=5 --fetch-retry-maxtimeout=60000 &&
      npm run build -w @proofchain/shared &&
      npm run build -w @proofchain/backend &&
      npm prune --omit=dev
    startCommand: node apps/backend/dist/main.js
    # Free: the instance sleeps after 15 minutes idle and the next request
    # waits for it to wake.
    plan: free
    region: frankfurt
    healthCheckPath: /health

    # No preDeployCommand: it needs a paid instance type, and so does a shell
    # on the service. Migrations are run by hand against DATABASE_URL from a
    # clone after the build (`migrationsRun` stays false in the app itself —
    # several instances booting at once would race to apply the same one):
    #   npm run build -w @proofchain/backend
    #   npm run migration:run:prod -w @proofchain/backend
    # On a paid plan, add this back so the schema is never behind the code:
    #   preDeployCommand: npm run migration:run:prod -w @proofchain/backend

    envVars:
      - key: NODE_ENV
        value: production
      # Kept in step with .github/workflows/ci.yml: `npm ci` resolves the
      # whole workspace graph, and apps/mobile (metro) requires ^20.19.4 even
      # though this service never builds it.
      - key: NODE_VERSION
        value: "20.19.4"
      # Render routes through its own load balancer, so X-Forwarded-For has
      # exactly one hop worth trusting. Without this the login and ingest rate
      # limits would put every client in one bucket. See config/trust-proxy.ts.
      - key: TRUST_PROXY
        value: "1"
      # Neon's pooled connection string, including its ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The dashboard and capture origins. Production honours this allowlist
      # alone; the development loopback fallback is off.
      - key: CORS_ORIGINS
        sync: false
      # Weigh-in photos go to an S3-compatible bucket (Cloudflare R2, Supabase
      # Storage, S3): this instance's disk is wiped on every restart and deploy.
      # R2's endpoint is https://<account-id>.r2.cloudflarestorage.com and its
      # region "auto" (the default). Supabase and AWS also need PHOTO_S3_REGION
      # set to the bucket's region. See config/configuration.ts.
      - key: PHOTO_S3_BUCKET
        sync: false
      - key: PHOTO_S3_ENDPOINT
        sync: false
      - key: PHOTO_S3_ACCESS_KEY_ID
        sync: false
      - key: PHOTO_S3_SECRET_ACCESS_KEY
        sync: false

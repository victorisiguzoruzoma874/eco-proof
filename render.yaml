# Render blueprint: the API.
#
# Apply it from the Render dashboard (Blueprints → New Blueprint Instance) after
# pointing it at this repository.
#
# Postgres is deliberately NOT declared here: the database is on Neon, which
# keeps the evidentiary record independent of this platform account and gives
# point-in-time restore that a Render free-tier database does not.
#
# Secrets are declared `sync: false`, which means Render prompts for them once
# and stores them encrypted rather than reading them out of this file. Nothing
# in this repository should ever hold a real secret.

services:
  # -------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------
  - type: web
    name: proofchain-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/backend/dist/main.js
    plan: starter
    region: frankfurt
    healthCheckPath: /health

    # Runs after the image is built and before traffic moves to it, so the
    # schema is never behind the code that expects it. `migrationsRun` stays
    # false in the app itself: several instances booting at once would race to
    # apply the same migration.
    #
    # NOTE: preDeployCommand requires a paid instance type. On the free plan,
    # delete these two lines and run migrations by hand from a shell instead:
    #   npm run migration:run:prod -w @proofchain/backend
    preDeployCommand: npm run migration:run:prod -w @proofchain/backend

    envVars:
      - key: NODE_ENV
        value: production
      # Render routes through its own load balancer, so X-Forwarded-For has
      # exactly one hop worth trusting. Without this the login and ingest rate
      # limits would put every client in one bucket. See config/trust-proxy.ts.
      - key: TRUST_PROXY
        value: "1"
      # Neon's pooled connection string, including its ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The dashboard and capture origins. Production honours this allowlist
      # alone; the development loopback fallback is off.
      - key: CORS_ORIGINS
        sync: false
